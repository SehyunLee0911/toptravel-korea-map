<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Korea Travel Map</title>

<style>

:root {
    --sidebar-width: 320px;
    --sidebar-tab-width: 30px;
    --sidebar-tab-height: 104px;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

    background: #e3f3f3;
    color: #1d2925;

    overflow: hidden;
}

.app {
    display: flex;
    width: 100%;
    height: 100vh;
}


/* ============================================================
   SIDEBAR
============================================================ */

.sidebar {
    width: var(--sidebar-width);
    min-width: var(--sidebar-width);
    height: 100%;

    position: relative;

    background: #fff;

    border-right: 1px solid #e5e7e6;

    padding: 28px 22px;

    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-gutter: stable;

    z-index: 50;
}

/*
    참조 이미지의 좌측 상단 타이틀 + 심볼 영역
    이미지는 sidebar_brand_logo.png만 교체하면 됩니다.
*/
.sidebar-brand {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;

    margin-bottom: 28px;
}

.sidebar-brand-copy {
    flex: 1;
    min-width: 0;
}

.sidebar-brand-logo {
    width: 58px;
    height: 58px;
    flex: 0 0 58px;

    margin-top: -5px;

    object-fit: contain;
    opacity: .72;

    pointer-events: none;
    user-select: none;
}

/*
    참조 이미지의 흰색 중앙 탭.
    sidebar 자체에 스크롤이 생겨도 viewport의 높이 50%에 고정됩니다.
*/
.sidebar-center-tab {
    position: fixed;

    left: calc(var(--sidebar-width) - 1px);
    top: 50%;

    width: var(--sidebar-tab-width);
    height: var(--sidebar-tab-height);

    transform: translateY(-50%);

    background: #fff;

    clip-path: polygon(
        0 0,
        100% 22%,
        100% 78%,
        0 100%
    );

    filter: drop-shadow(1px 0 0 #e5e7e6);

    z-index: 55;
    pointer-events: none;
}

.eyebrow {
    font-size: 11px;
    font-weight: 700;

    letter-spacing: 2px;

    color: #6c7772;

    margin-bottom: 7px;
}

h1 {
    margin: 0;

    font-size: 28px;
    line-height: 1;
}

.section-title {
    font-size: 12px;
    font-weight: 700;

    margin-bottom: 10px;

    color: #59635f;
}

/* 여행 순서 제목 + 옵션 선택 */
.trip-section-header {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 10px;
}

.trip-section-header .section-title {
    flex: 1;
    margin: 0;
}

.trip-section-header .section-title::after {
    display: none;
}

.trip-option-btn {
    border: 1px solid rgba(234,220,174,.42);
    border-radius: 999px;
    padding: 3px 7px;
    background: rgba(4,20,51,.18);
    color: var(--passport-gold, #eadcae);
    font-family: inherit;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .2px;
    cursor: pointer;
}

.trip-option-btn.active {
    background: var(--passport-gold-strong, #d8c27d);
    border-color: var(--passport-gold-strong, #d8c27d);
    color: var(--passport-navy-dark, #0b214f);
}

.date-change-btn {
    white-space: nowrap;
}

/* 시작 날짜 선택 팝업 */
.start-date-backdrop {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(10,23,55,.38);
    z-index: 140;
}

.start-date-backdrop.open {
    display: flex;
}

.start-date-modal {
    width: min(390px, calc(100vw - 36px));
    padding: 24px;
    border-radius: 14px;
    background: #fff;
    box-shadow: 0 24px 70px rgba(5,18,45,.28);
    text-align: center;
}

.start-date-modal h2 {
    margin: 0 0 8px;
    color: #1b3b77;
    font-size: 20px;
}

.start-date-modal p {
    margin: 0 0 16px;
    color: #68736e;
    font-size: 12px;
    line-height: 1.5;
}

.start-date-input {
    width: 100%;
    height: 42px;
    padding: 0 12px;
    border: 1px solid #cfd7d3;
    border-radius: 8px;
    font: inherit;
    color: #1d2925;
}

.start-date-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 14px;
}

.start-date-action {
    height: 40px;
    border-radius: 8px;
    border: 1px solid #d8dfdc;
    background: #fff;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
}

.start-date-action.primary {
    border-color: #1b3b77;
    background: #1b3b77;
    color: #fff;
}


/* ============================================================
   TRIP LIST
============================================================ */

.trip-list {
    list-style: none;

    margin: 0;
    padding: 0;
}

.trip-item {
    display: flex;

    align-items: flex-start;

    gap: 9px;

    padding: 9px 4px;

    border-radius: 8px;

    cursor: grab;

    user-select: none;
}

.trip-item:hover {
    background: #f7f9f8;
}

.trip-item.dragging {
    opacity: .35;
}

.trip-item.drop-target {
    background: #edf4f1;
}


/* ============================================================
   TIMELINE
============================================================ */

.timeline {
    width: 15px;
    min-width: 15px;

    position: relative;

    display: flex;

    justify-content: center;
}

.timeline::before {
    content: "";

    width: 8px;
    height: 8px;

    margin-top: 5px;

    border-radius: 50%;

    background: #ee5744;

    z-index: 2;
}

.trip-item:not(:last-child)
.timeline::after {

    content: "";

    position: absolute;

    top: 14px;
    bottom: -16px;

    width: 1px;

    background: #d8ddda;
}


/* ============================================================
   TRIP INFO
============================================================ */

.trip-info {
    flex: 1;

    min-width: 0;
}

.trip-date {
    font-size: 11px;

    color: #858d89;

    margin-bottom: 3px;
}

.trip-name-row {
    display: flex;

    align-items: center;

    gap: 6px;

    min-width: 0;
}

.trip-name {
    min-width: 0;

    font-size: 15px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.trip-visit-count {
    flex: 0 0 auto;

    padding: 2px 6px;

    border: 1px solid #d8dfdc;

    border-radius: 999px;

    background: #f7f9f8;

    font-size: 10px;

    font-weight: 700;

    color: #69736f;

    line-height: 1.3;
}

.trip-type {
    margin-top: 3px;

    font-size: 10px;

    color: #a0a6a3;
}


/* ============================================================
   DELETE
============================================================ */

.delete-btn {
    width: 24px;
    height: 24px;

    border: 0;

    background: transparent;

    border-radius: 50%;

    color: #a6aca9;

    font-size: 17px;

    cursor: pointer;
}

.delete-btn:hover {
    color: #e94f3c;

    background: #f7f7f7;
}


/* ============================================================
   ADD BUTTON
============================================================ */

.add-btn {
    width: 100%;
    height: 44px;

    margin-top: 9px;

    background: #fff;

    border: 1px dashed #bec6c2;

    border-radius: 8px;

    font-size: 13px;

    cursor: pointer;
}

.add-btn:hover {
    background: #f7f9f8;

    border-color: #8e9994;
}


/* ============================================================
   TRAVEL BUTTON
============================================================ */

.travel-controls {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 8px;

    margin-top: 9px;
}

.travel-btn {
    height: 42px;

    border: 1px solid #d8dfdc;

    border-radius: 8px;

    background: #fff;

    font-size: 13px;

    cursor: pointer;
}

.travel-btn:hover:not(:disabled) {
    background: #f5f8f6;
}

.travel-btn:disabled {
    opacity: .45;

    cursor: not-allowed;
}

.save-controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 9px;
}

.save-controls .travel-btn {
    width: 100%;
}

.travel-status {
    margin-top: 8px;

    min-height: 18px;

    text-align: center;

    font-size: 11px;

    color: #7c8782;
}


/* ============================================================
   MAP AREA
============================================================ */

.map-area {
    position: relative;

    flex: 1;

    min-width: 0;

    height: 100%;

    background: #B7DDE8;

    overflow: hidden;
}

.country-title {
    position: absolute;

    left: 28px;
    top: 26px;

    z-index: 10;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: 2px;

    color: #67736e;
}


/* ============================================================
   MAP
============================================================ */

.map-container {
    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: min(850px, 82vw);

    aspect-ratio: 1 / 1;
}

.map-container > img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: contain;
}


/* ============================================================
   OVERLAY
============================================================ */

.map-overlay {
    position: absolute;

    inset: 0;

    pointer-events: none;
}


/* ============================================================
   ROUTE SVG
============================================================ */

.route-svg {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    overflow: visible;

    pointer-events: none;
}

.route-line {
    fill: none;

    stroke: #303b37;

    stroke-width: 2.5;

    stroke-dasharray: 7 6;

    vector-effect: non-scaling-stroke;

    marker-end: url(#arrowMarker);
}


/* ============================================================
   LOCATION MARKER
============================================================ */

.location-marker {
    position: absolute;

    transform:
        translate(-50%, -50%);

    width: 17px;
    height: 17px;

    border-radius: 50%;

    background: #fff;

    border: 3px solid #ed5542;

    box-shadow:
        0 1px 5px rgba(0,0,0,.18);

    z-index: 25;

    pointer-events: auto;
    cursor: grab;
    touch-action: none;
}

.location-marker:hover {
    transform:
        translate(-50%, -50%)
        scale(1.16);
}

.location-marker.dragging {
    cursor: grabbing;
    transform:
        translate(-50%, -50%)
        scale(1.22);
    box-shadow:
        0 2px 9px rgba(0,0,0,.28);
}


/* ============================================================
   LOCATION NAME
============================================================ */

.location-name {
    position: absolute;

    transform:
        translate(-50%, -50%);

    white-space: nowrap;

    padding: 5px 9px;

    border-radius: 5px;

    background:
        rgba(255,255,255,.96);

    border: 1px solid #e2e5e3;

    box-shadow:
        0 2px 7px rgba(0,0,0,.08);

    font-size: 12px;

    font-weight: 700;

    color: #202724;

    z-index: 14;

    pointer-events: none;
}


/* ============================================================
   DATE BOX
============================================================ */

.date-box {
    position: absolute;

    width: 126px;

    padding: 3px 5px;

    background:
        rgba(255,255,255,.97);

    border: 1px solid #e2e5e3;

    border-radius: 6px;

    box-shadow:
        0 2px 7px rgba(0,0,0,.10);

    z-index: 20;

    pointer-events: auto;

    transform-origin: center center;
}

/*
    이동수단이 해당 도시에 도착했을 때
    도시/날짜 박스를 잠깐 확대하고 좌측 여권 사이드바의 진청색으로 강조합니다.
*/
.date-box.arrival-highlight {
    animation: arrivalDatePulse 5500ms cubic-bezier(.2,.78,.22,1) both;
}

.date-box.arrival-highlight,
.date-box.arrival-highlight .date-place-name,
.date-box.arrival-highlight .visit-number,
.date-box.arrival-highlight .visit-date-input {
    color: #fff;
}

.date-box.arrival-highlight .date-place-name {
    border-bottom-color: rgba(255,255,255,.36);
}

.date-box.arrival-highlight .visit-date-row + .visit-date-row {
    border-top-color: rgba(255,255,255,.26);
}

.date-box.arrival-highlight .visit-date-input {
    color-scheme: dark;
}

.date-box.arrival-highlight .visit-date-editor {
    width: 100%;
    border: 0;
    outline: none;
    background: transparent;
    text-align: center;
    cursor: pointer;
}

.visit-date-editor:focus {
    background: rgba(27,59,119,.06);
    border-radius: 4px;
}

.visit-date-input::-webkit-calendar-picker-indicator {
    filter: invert(1) brightness(2);
}

@keyframes arrivalDatePulse {
    0% {
        transform: scale(1);
        background: rgba(255,255,255,.97);
        box-shadow: 0 2px 7px rgba(0,0,0,.10);
    }

    28% {
        transform: scale(1.08);
        background: #1b3b77;
        box-shadow: 0 10px 24px rgba(10,25,64,.28);
    }

    76% {
        transform: scale(1.08);
        background: #1b3b77;
        box-shadow: 0 10px 24px rgba(10,25,64,.24);
    }

    100% {
        transform: scale(1);
        background: rgba(255,255,255,.97);
        box-shadow: 0 2px 7px rgba(0,0,0,.10);
    }
}

.date-place-name {
    display: flex;

    align-items: center;
    justify-content: center;

    min-height: 21px;

    margin: -3px -5px 3px;

    padding: 4px 6px;

    border-bottom: 1px solid #e2e5e3;

    font-size: 12px;
    font-weight: 700;

    color: #202724;

    text-align: center;

    white-space: nowrap;

    overflow: hidden;
    text-overflow: ellipsis;
}

.visit-date-row {
    display: flex;
    align-items: center;

    gap: 4px;

    min-height: 24px;
}

.visit-date-row + .visit-date-row {
    border-top: 1px solid #edf0ee;
}

.visit-number {
    flex: 0 0 auto;

    font-size: 11px;

    font-weight: 700;

    color: #69736f;

    text-align: left;
}

.visit-date-input {
    flex: 1 1 auto;
    min-width: 0;

    display: block;

    font-family: inherit;

    font-size: 12px;
    font-weight: 600;
    line-height: 1.15;

    color: #59635f;
    text-align: center;

    white-space: nowrap;
}

.visit-date-row.no-visit-label .visit-date-input {
    width: 100%;
    flex-basis: 100%;
}


/* ============================================================
   TRAVEL VEHICLE
============================================================ */

.travel-vehicle {
    position: absolute;

    width: 48px;
    height: 48px;

    transform:
        translate(-50%, -50%);

    z-index: 30;

    pointer-events: none;

    filter:
        drop-shadow(
            0 2px 3px rgba(0,0,0,.16)
        );

    will-change:
        left,
        top,
        transform;
}

.travel-vehicle img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: contain;
}


/* ============================================================
   HELP
============================================================ */

.help {
    position: absolute;

    right: 20px;
    bottom: 18px;

    z-index: 10;

    padding: 7px 10px;

    background:
        rgba(255,255,255,.72);

    border-radius: 6px;

    color: #68736e;

    font-size: 10px;
}


/* ============================================================
   TOP TRAVEL LOGO
============================================================ */

.toptravel-logo {
    position: absolute;

    left: 50%;
    bottom: 18px;

    transform:
        translateX(-50%);

    width: min(240px, 28vw);
    height: auto;

    z-index: 10;

    pointer-events: none;
}


/* ============================================================
   MODAL
============================================================ */

.modal-backdrop {
    position: fixed;

    inset: 0;

    background:
        rgba(20,30,27,.22);

    z-index: 100;

    display: none;
}

.modal-backdrop.open {
    display: block;
}

.modal {
    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: min(
        620px,
        calc(100vw - 40px)
    );

    max-height: 78vh;

    background: #fff;

    border-radius: 14px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.20);

    overflow: hidden;
}

.modal-header {
    display: flex;

    align-items: center;

    padding: 19px 21px 14px;

    border-bottom: 1px solid #eee;
}

.modal-title {
    flex: 1;

    margin: 0;

    font-size: 19px;
}

.close-btn {
    width: 32px;
    height: 32px;

    border: 0;

    border-radius: 50%;

    background: #f1f3f2;

    font-size: 18px;

    cursor: pointer;
}


/* ============================================================
   SEARCH
============================================================ */

.search {
    width: calc(100% - 40px);

    height: 41px;

    margin: 15px 20px;

    padding: 0 12px;

    border: 1px solid #dadfdd;

    border-radius: 8px;

    outline: none;

    font-family: inherit;

    font-size: 13px;
}

.search:focus {
    border-color: #8d9893;
}


/* ============================================================
   PLACE GRID
============================================================ */

.place-grid {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0,1fr));

    gap: 8px;

    padding:
        0
        20px
        20px;

    max-height: 53vh;

    overflow-y: auto;
}

.place-option {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 8px;

    padding: 11px 12px;

    background: #fff;

    border: 1px solid #e4e8e6;

    border-radius: 8px;

    text-align: left;

    cursor: pointer;
}

.place-option:hover {
    background: #f6f8f7;

    border-color: #c8d0cc;
}

.place-option strong {
    font-size: 13px;
}

.place-option span {
    font-size: 10px;

    color: #8a938f;
}

.no-result {
    grid-column: 1 / -1;

    text-align: center;

    padding: 35px 0;

    color: #8b938f;

    font-size: 13px;
}


/* ============================================================
   RESPONSIVE
============================================================ */

@media(max-width:850px) {

    :root {
        --sidebar-width: 260px;
    }

    .sidebar-brand-logo {
        width: 50px;
        height: 50px;
        flex-basis: 50px;
    }

    .map-container {
        width: 760px;
        max-width: none;
    }

    .place-grid {
        grid-template-columns: 1fr;
    }
}



/* ============================================================
   PASSPORT-INSPIRED SIDEBAR THEME + COLLAPSE TOGGLE
   - 대한민국 여권의 짙은 남색 + 아이보리/금색 계열에서 영감을 받은 구성
   - 중앙 탭은 viewport 높이 50%에 고정되므로 사이드바 스크롤과 무관하게 중앙 유지
============================================================ */

:root {
    --passport-navy: #1b3b77;
    --passport-navy-deep: #102b60;
    --passport-navy-dark: #0b214f;
    --passport-gold: #eadcae;
    --passport-gold-strong: #d8c27d;
    --passport-gold-muted: #b7a46c;
    --passport-ivory: #fff8df;
    --passport-line: rgba(234, 220, 174, .42);
}

.sidebar {
    margin-left: 0;

    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(234, 220, 174, .055) 0 1px,
            transparent 1.5px
        ) 0 0 / 13px 13px,
        linear-gradient(
            180deg,
            #214483 0%,
            var(--passport-navy) 43%,
            var(--passport-navy-deep) 100%
        );

    color: var(--passport-ivory);
    border-right: 1px solid rgba(234, 220, 174, .46);

    padding: 24px 22px 28px;

    box-shadow:
        inset -1px 0 rgba(255,255,255,.06),
        12px 0 36px rgba(9, 29, 70, .10);

    scrollbar-width: thin;
    scrollbar-color:
        rgba(234, 220, 174, .48)
        rgba(7, 24, 59, .22);

    transition:
        margin-left .34s cubic-bezier(.22,.72,.2,1),
        box-shadow .34s ease;
}

/* 여권 표지처럼 은은한 원형 보안무늬 */
.sidebar::before {
    content: "";

    position: absolute;
    left: 42px;
    top: 250px;

    width: 205px;
    height: 205px;

    border: 1px solid rgba(234, 220, 174, .075);
    border-radius: 50%;

    box-shadow:
        0 0 0 12px rgba(234, 220, 174, .025),
        0 0 0 24px rgba(234, 220, 174, .045),
        0 0 0 37px rgba(234, 220, 174, .022),
        inset 0 0 0 18px rgba(234, 220, 174, .02);

    opacity: .95;
    pointer-events: none;
    z-index: 0;
}

.sidebar > * {
    position: relative;
    z-index: 1;
}

.sidebar::-webkit-scrollbar {
    width: 8px;
}

.sidebar::-webkit-scrollbar-track {
    background: rgba(7, 24, 59, .22);
}

.sidebar::-webkit-scrollbar-thumb {
    background: rgba(234, 220, 174, .47);
    border: 2px solid transparent;
    border-radius: 999px;
    background-clip: padding-box;
}

.sidebar::-webkit-scrollbar-thumb:hover {
    background: rgba(234, 220, 174, .70);
    border: 2px solid transparent;
    background-clip: padding-box;
}

.sidebar-brand {
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;

    margin-bottom: 24px;
    padding: 5px 8px 24px;

    text-align: center;
    border-bottom: 1px solid var(--passport-line);

/*

    sidebar가 스크롤되어도 position: fixed + top:50%라 항상 화면 높이 중앙에 유지.
    열림: ◀ (닫기)
    닫힘: ▶ (열기)
*/
.sidebar-center-tab {
    position: fixed;

    left: calc(var(--sidebar-width) - 1px);
    top: 50%;

    width: 42px;
    height: 98px;

    transform: translateY(-50%);

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0 3px 0 0;

    background: linear-gradient(
        180deg,
        #f4e8bd 0%,
        var(--passport-gold-strong) 100%
    );

    border: 0;

    clip-path: polygon(
        0 0,
        72% 0,
        100% 22%,
        100% 78%,
        72% 100%,
        0 100%
    );

    color: var(--passport-navy-dark);
    font-family: Arial, "Noto Sans KR", sans-serif;
    font-size: 18px;
    font-weight: 900;
    line-height: 1;

    cursor: pointer;
    user-select: none;
    pointer-events: auto;

    filter:
        drop-shadow(1px 0 rgba(73,61,24,.18))
        drop-shadow(4px 4px 8px rgba(13,35,76,.16));

    z-index: 80;

    transition:
        left .34s cubic-bezier(.22,.72,.2,1),
        filter .16s ease,
        background .16s ease;
}

.sidebar-center-tab:hover {
    background: linear-gradient(
        180deg,
        #fff4ca 0%,
        #e3cf8b 100%
    );

    filter:
        drop-shadow(1px 0 rgba(73,61,24,.22))
        drop-shadow(5px 5px 10px rgba(13,35,76,.22));
}

.sidebar-center-tab:focus-visible {
    outline: 3px solid rgba(255, 248, 223, .88);
    outline-offset: 3px;
}

/* 사이드바를 왼쪽 화면 밖으로 밀어 지도 영역을 전체 폭으로 확장 */
.app.sidebar-collapsed .sidebar {
    margin-left: calc(var(--sidebar-width) * -1);
    box-shadow: none;
}

.app.sidebar-collapsed .sidebar-center-tab {
    left: 0;
}

    .sidebar-center-tab {

   - 같은 문양을 사이드바 중앙 워터마크로 사용
============================================================ */

.sidebar-brand {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 14px;

    padding: 5px 0 22px;
    text-align: left;
}

.sidebar-brand::after {
    display: none;
}

.sidebar-brand-copy {
    flex: 1 1 auto;

}

.sidebar-brand-logo {
    order: 0;

    width: 78px;
    height: 74px;
    flex: 0 0 78px;

    opacity: .98;

    filter:
        drop-shadow(0 1px 0 rgba(0,0,0,.10))

/*
    사이드바 중간의 여권 보안무늬를 업로드한 문양 워터마크로 교체.
    fixed를 사용해 도시 목록이 길어져 사이드바를 스크롤해도
    화면 기준 중앙 위치를 유지합니다.
*/
.sidebar::before {
    content: "";

    position: fixed;
    left: calc(var(--sidebar-width) / 2);
    top: 50%;

    width: 232px;
    height: 220px;

    transform: translate(-50%, -50%);

    background:
        url("sidebar_brand_Logo.png")
        center / contain
        no-repeat;

    border: 0;
    border-radius: 0;
    box-shadow: none;

    opacity: .075;

    pointer-events: none;
    z-index: 0;

    transition:
        left .34s cubic-bezier(.22,.72,.2,1),
        opacity .24s ease;
}

.app.sidebar-collapsed .sidebar::before {
    left: calc(var(--sidebar-width) * -0.5);
    opacity: 0;
}

        gap: 10px;
    }

        width: 64px;
        height: 62px;
        flex-basis: 64px;
    }

    .sidebar::before {
        width: 192px;
        height: 181px;
    }
}
